[project]
name = "brq-at-work"
version = "0.1.0"
description = "Distribuição BRQ@work do pxOS"
requires-python = ">=3.12,<3.13"
dependencies = ["pxos-kernel", "pxos-granola", "pxos-sharepoint", "pxos-teams", "pxos-telegram"]

[tool.uv.sources]
pxos-kernel = { workspace = true }
pxos-granola = { workspace = true }
pxos-sharepoint = { workspace = true }
pxos-teams = { workspace = true }
pxos-telegram = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

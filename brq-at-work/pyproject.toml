[project]
name = "brq-at-work"
version = "0.1.0"
description = "Distribuição BRQ@work da Guilda"
requires-python = ">=3.12,<3.13"
dependencies = ["guilda-kernel", "guilda-granola", "guilda-sharepoint", "guilda-teams", "guilda-telegram"]

[tool.uv.sources]
guilda-kernel = { workspace = true }
guilda-granola = { workspace = true }
guilda-sharepoint = { workspace = true }
guilda-teams = { workspace = true }
guilda-telegram = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

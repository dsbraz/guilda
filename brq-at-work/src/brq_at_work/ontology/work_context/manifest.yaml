name: work_context
version: 0.1.0
types:
  - name: WorkStream
  - name: Meeting
  - name: Commitment
    readers: [project-manager, team-member]
  - name: Decision
actions:
  - name: create_commitment
    creates: Commitment
    approver: project-manager
    reversible: true
    rule_parameters: [due_date]
    # Prazo de até 14 dias pode ser registrado direto por agente em fase 2 ou 3 (PXOS-86).
    rules:
      - {parameter: due_date, within_days: 14}

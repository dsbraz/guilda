# Identidades sintéticas da fatia 1. Identidades reais chegam com OIDC (PXOS-29).
actors:
  - id: ana
    kind: internal_person
    name: Ana (gerente de projeto)
    roles: [project-manager]
    channel_ids: [teams:ana]
  - id: bruno
    kind: internal_person
    name: Bruno
    roles: [team-member]
    channel_ids: [teams:bruno]
  - id: celia
    kind: internal_person
    name: Célia
    roles: [team-member]
  # Aprova as versões de agentes (ADR 0004).
  - id: eva
    kind: internal_person
    name: Eva (administradora da plataforma)
    roles: [platform-admin]
  # Agente especialista do report semanal (weekly_report_agent.yaml): lê sua definição,
  # pergunta na thread do projeto e propõe o report; quem aprova é o PM.
  - id: weekly-report-agent
    kind: agent
    name: Agente do report semanal
    roles: [agent]
  # Contato do cliente: identidade própria, sem acesso ao contexto interno (PXOS-61).
  - id: dora
    kind: external_person
    name: Dora (cliente)
    channel_ids: [teams:dora]

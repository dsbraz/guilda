# Identidades sintéticas da fatia 1. Identidades reais chegam com OIDC (K29).
actors:
  - id: ana
    kind: internal_person
    name: Ana (gerente de projeto)
    roles: [project-manager]
    channel_ids: [teams:ana]
  - id: bruno
    kind: internal_person
    name: Bruno
    roles: [team-member]
    channel_ids: [teams:bruno]
  - id: celia
    kind: internal_person
    name: Célia
    roles: [team-member]
  # Aprova as versões de agentes (ADR 0004).
  - id: eva
    kind: internal_person
    name: Eva (administradora da plataforma)
    roles: [platform-admin]
  # Assistente do projeto (project_assistant.yaml): lê sua definição, pergunta na thread
  # do projeto e propõe o report semanal; quem aprova é o PM.
  - id: project-assistant
    kind: agent
    name: Assistente do projeto
    roles: [agent]
  # Contato do cliente: identidade própria, sem acesso ao contexto interno (K61).
  - id: dora
    kind: external_person
    name: Dora (cliente)
    channel_ids: [teams:dora]

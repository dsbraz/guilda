[project]
name = "guilda-adk-temporal-spike"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["google-adk", "temporalio", "httpx", "fastapi", "uvicorn", "pydantic"]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]


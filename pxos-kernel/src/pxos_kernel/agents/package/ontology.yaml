# Pacote de agentes do kernel (ADR 0004 §3, K34). A definição de um agente é um tipo
# canônico: cada revisão aprovada é uma versão publicada, imutável, com digest.
id: https://pxos.example/ontology/agents
name: pxos_agents
title: Agentes da plataforma
version: 0.1.0
annotations:
  pxos.base_version: 0.1.0
prefixes:
  linkml: https://w3id.org/linkml/
  agents: https://pxos.example/ontology/agents/
default_prefix: agents
default_range: string
imports:
  - linkml:types
  - pxos_base

classes:
  AgentVersion:
    title: Versão de agente
    description: >-
      Definição publicada de um agente e do seu ciclo. O modelo não faz parte dela: vem
      da rota da residência da instalação.
    annotations:
      pxos.kind: canonical
    attributes:
      agent:
        title: agente
        required: true
        annotations:
          pxos.refers_to: Actor
      instructions:
        title: instruções
        description: O que o agente faz.
        required: true
      memory_instructions:
        title: instruções para a memória de contexto
        description: O que a memória de contexto extrai de cada fonte.
        required: true
      tools:
        title: ferramentas
        description: Ferramentas que o kernel monta para o agente.
        range: AgentTool
        multivalued: true
      recall_tags:
        title: escopo da consulta à memória
        description: >-
          Tags de acesso que o kernel impõe à consulta e às retenções do ciclo; nunca vêm do
          modelo. A consulta só alcança o que foi retido com uma delas.
        multivalued: true
        required: true
        minimum_cardinality: 1
      schedule:
        title: agenda
        description: Quando o ciclo começa, em cron de cinco campos.
        required: true
        pattern: "^\\S+( \\S+){4}$"
      answer_deadline_hours:
        title: prazo das respostas em horas
        range: integer
        required: true
        minimum_value: 1
      max_rounds:
        title: máximo de rodadas
        range: integer
        required: true
        minimum_value: 1
      thread:
        title: thread
        description: Onde o agente pergunta e entrega.
        required: true
      deliverable:
        title: entrega
        description: Ação que propõe a entrega do ciclo, como pacote.ação.
        required: true
        pattern: "^[a-z][a-z0-9_]*\\.[a-z][a-z0-9_]*$"

enums:
  AgentTool:
    title: Ferramenta de agente
    permissible_values:
      recall:
        title: consulta à memória de contexto

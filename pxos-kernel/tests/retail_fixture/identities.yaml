actors:
  - id: carla
    kind: internal_person
    name: Carla
    roles: [store-manager]
  - id: diego
    kind: internal_person
    name: Diego
    roles: [store-manager]
  - id: erin
    kind: internal_person
    name: Erin
    roles: [store-staff]
  - id: gina
    kind: internal_person
    name: Gina
    roles: [store-staff]
  - id: frank
    kind: internal_person
    name: Frank
  - id: paula
    kind: internal_person
    name: Paula (administradora da plataforma)
    roles: [platform-admin]
  # A supplier's contact. The store-manager role is deliberate: an external actor reaches
  # no internal context whatever roles it holds (PXOS-61).
  - id: vera
    kind: external_person
    name: Vera (fornecedora)
    roles: [store-manager]
  - id: restock-agent
    kind: agent
    name: Agente de reposição
    roles: [agent]
  # Fases de autonomia (PXOS-83): o restock-agent fica na fase 1, o padrão.
  - id: planner-agent
    kind: agent
    name: Agente de planejamento
    roles: [agent]
    autonomy: 2
  - id: night-agent
    kind: agent
    name: Agente noturno
    roles: [agent]
    autonomy: 3
delegations:
  - agent: restock-agent
    person: carla
  - agent: restock-agent
    person: erin
  - agent: planner-agent
    person: erin
  - agent: night-agent
    person: erin
  # Frank não lê pedidos: o que o agente pedir por ele é negado pela política (PXOS-84).
  - agent: planner-agent
    person: frank

[project]
name = "guilda-granola"
version = "0.1.0"
description = "Transcrições de reuniões do Granola para a Guilda"
requires-python = ">=3.12,<3.13"
dependencies = ["guilda-kernel"]

[tool.uv.sources]
guilda-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

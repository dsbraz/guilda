[project]
name = "guilda-teams"
version = "0.1.0"
description = "Canal Microsoft Teams para a Guilda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "guilda-kernel",
    "httpx==0.28.1",
    "pyjwt[crypto]==2.15.1",
    "starlette==1.10.0",
]

[tool.uv.sources]
guilda-kernel = { workspace = true }

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

# Pacote fixture de outro domínio (varejo), para provar a neutralidade do kernel.
id: https://guilda.example/fixtures/retail
name: retail
title: Varejo (fixture)
version: 0.1.0
annotations:
  guilda.base_version: 0.1.0
prefixes:
  linkml: https://w3id.org/linkml/
  retail: https://guilda.example/fixtures/retail/
default_prefix: retail
default_range: string
imports:
  - linkml:types
  - guilda_base

classes:
  RestockOrder:
    title: Pedido de reposição
    annotations:
      guilda.kind: canonical
    attributes:
      occurred_at:
        title: ocorreu em
        range: datetime
        required: true
      sku:
        title: SKU
        required: true
      quantity:
        title: quantidade
        range: integer
        required: true
        minimum_value: 1
      assignee:
        title: responsável
        annotations:
          guilda.refers_to: Actor


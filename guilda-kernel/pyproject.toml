[project]
name = "guilda-kernel"
version = "0.1.0"
description = "Kernel da Guilda"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "httpx==0.28.1",
    "asyncpg==0.32.0",
    "linkml==1.12.1",
    "pydantic==2.14.3",
    "pyyaml==6.0.3",
    "sqlalchemy[asyncio]>=2.1.8",
    "temporalio==1.36.1",
    "google-adk==2.14.1",
    "anthropic[vertex]==2.8.0",
    "uvicorn==0.54.0",
]

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"

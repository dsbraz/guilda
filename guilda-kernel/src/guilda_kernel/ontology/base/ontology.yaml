# Ontologia base da Guilda (PRD §7). Nomes em inglês, rótulos em português (ADR 0003).
# Todo tipo declara guilda.kind: canonical (autoriza ação ou alimenta medição).
id: https://guilda.example/ontology/base
name: guilda_base
title: Ontologia base da Guilda
version: 0.1.0
prefixes:
  linkml: https://w3id.org/linkml/
  guilda: https://guilda.example/ontology/base/
default_prefix: guilda
default_range: string
imports:
  - linkml:types

classes:
  Actor:
    title: Ator
    description: Pessoa interna, pessoa externa ou agente.
    annotations:
      guilda.kind: canonical
    attributes:
      name:
        title: nome
        required: true
      actor_kind:
        title: tipo de ator
        range: ActorKind
        required: true

enums:
  ActorKind:
    title: Tipo de ator
    permissible_values:
      internal_person:
        title: pessoa interna
      external_person:
        title: pessoa externa
      agent:
        title: agente

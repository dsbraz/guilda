# Product quality only; spikes retain their own local validation.
name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  actions: read
jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        mode: [ci, mutation]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:0.8.1-pg16
        env:
          POSTGRES_USER: pxos
          POSTGRES_PASSWORD: pxos-local
          POSTGRES_DB: pxos
        ports: ["25432:5432"]
        options: >-
          --health-cmd "pg_isready -U pxos -d pxos"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - run: uv run python -m quality ${{ matrix.mode }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quality-${{ matrix.mode }}
          path: quality-reports/
          retention-days: 90
          if-no-files-found: error
  approve:
    needs: quality
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: astral-sh/setup-uv@v10.3.3
      - run: uv sync --locked
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: quality-*
          path: quality-reports
          merge-multiple: true
      - name: Read recent main evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run python -m quality.history_fetch
      - run: uv run python -m quality all --aggregate
        if: always()
        env:
          PXOS_QUALITY_JOBS_STATUS: ${{ needs.quality.result }}
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: quality-approved
          path: quality-reports/all.*
          retention-days: 90
          if-no-files-found: error

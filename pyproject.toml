[project]
name = "guilda"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["guilda-kernel", "brq-at-work", "guilda-granola", "guilda-sharepoint", "guilda-teams", "guilda-telegram"]

[tool.uv]
package = false

[tool.uv.sources]
guilda-kernel = { workspace = true }
brq-at-work = { workspace = true }
guilda-granola = { workspace = true }
guilda-sharepoint = { workspace = true }
guilda-teams = { workspace = true }
guilda-telegram = { workspace = true }

[tool.uv.workspace]
members = ["guilda-kernel", "brq-at-work", "connectors/*"]
exclude = ["spikes/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "**/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["guilda_kernel", "brq_at_work", "guilda_granola", "guilda_sharepoint", "guilda_teams", "guilda_telegram"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "agents_testing.py",
    "db_testing.py",
    "fakes_testing.py",
    "model_testing.py",
    "temporal_testing.py",
    "guilda-kernel/src",
    "guilda-kernel/tests",
    "brq-at-work/src",
    "brq-at-work/tests",
    "connectors/guilda-granola/src",
    "connectors/guilda-granola/tests",
    "connectors/guilda-sharepoint/src",
    "connectors/guilda-sharepoint/tests",
    "connectors/guilda-teams/src",
    "connectors/guilda-teams/tests",
    "connectors/guilda-telegram/src",
    "connectors/guilda-telegram/tests",
    "quality",
    "tests/quality",
]
mypy_path = [
    ".",
    "guilda-kernel/src",
    "brq-at-work/src",
    "connectors/guilda-granola/src",
    "connectors/guilda-sharepoint/src",
    "connectors/guilda-teams/src",
    "connectors/guilda-telegram/src",
    "guilda-kernel/tests",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["linkml.*", "linkml_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.generated"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "guilda-kernel/tests",
    "brq-at-work/tests",
    "connectors/guilda-granola/tests",
    "connectors/guilda-sharepoint/tests",
    "connectors/guilda-teams/tests",
    "connectors/guilda-telegram/tests",
    "tests/quality",
]
pythonpath = [".", "guilda-kernel/tests", "connectors/guilda-teams/tests", "connectors/guilda-telegram/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]

[tool.importlinter]
root_packages = ["guilda_kernel", "brq_at_work"]

[[tool.importlinter.contracts]]
name = "O kernel não importa a distribuição"
type = "forbidden"
source_modules = ["guilda_kernel"]
forbidden_modules = ["brq_at_work"]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]

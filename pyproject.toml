[project]
name = "pxos"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["pxos-kernel", "brq-at-work", "pxos-granola", "pxos-sharepoint", "pxos-teams", "pxos-telegram"]

[tool.uv]
package = false

[tool.uv.sources]
pxos-kernel = { workspace = true }
brq-at-work = { workspace = true }
pxos-granola = { workspace = true }
pxos-sharepoint = { workspace = true }
pxos-teams = { workspace = true }
pxos-telegram = { workspace = true }

[tool.uv.workspace]
members = ["pxos-kernel", "brq-at-work", "connectors/*"]
exclude = ["spikes/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["spikes", "**/generated.py"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["pxos_kernel", "brq_at_work", "pxos_granola", "pxos_sharepoint", "pxos_teams", "pxos_telegram"]

[tool.mypy]
python_version = "3.12"
strict = true
files = [
    "agents_testing.py",
    "db_testing.py",
    "fakes_testing.py",
    "model_testing.py",
    "temporal_testing.py",
    "pxos-kernel/src",
    "pxos-kernel/tests",
    "brq-at-work/src",
    "brq-at-work/tests",
    "connectors/pxos-granola/src",
    "connectors/pxos-granola/tests",
    "connectors/pxos-sharepoint/src",
    "connectors/pxos-sharepoint/tests",
    "connectors/pxos-teams/src",
    "connectors/pxos-teams/tests",
    "connectors/pxos-telegram/src",
    "connectors/pxos-telegram/tests",
    "quality",
    "tests/quality",
]
mypy_path = [
    ".",
    "pxos-kernel/src",
    "brq-at-work/src",
    "connectors/pxos-granola/src",
    "connectors/pxos-sharepoint/src",
    "connectors/pxos-teams/src",
    "connectors/pxos-telegram/src",
    "pxos-kernel/tests",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = ["linkml.*", "linkml_runtime.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["*.generated"]
ignore_errors = true

[tool.pytest.ini_options]
testpaths = [
    "pxos-kernel/tests",
    "brq-at-work/tests",
    "connectors/pxos-granola/tests",
    "connectors/pxos-sharepoint/tests",
    "connectors/pxos-teams/tests",
    "connectors/pxos-telegram/tests",
    "tests/quality",
]
pythonpath = [".", "pxos-kernel/tests", "connectors/pxos-teams/tests", "connectors/pxos-telegram/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--import-mode=importlib"]

[tool.importlinter]
root_packages = ["pxos_kernel", "brq_at_work"]

[[tool.importlinter.contracts]]
name = "O kernel não importa a distribuição"
type = "forbidden"
source_modules = ["pxos_kernel"]
forbidden_modules = ["brq_at_work"]

[dependency-groups]
dev = [
    "asyncpg-stubs>=0.32.0",
    "import-linter>=2.16",
    "mutmut>=3.8.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
    "types-pyyaml>=6.0.12.20261113",
]
